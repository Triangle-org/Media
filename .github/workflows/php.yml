name: PHP package checks

on:
  push:
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: PHP ${{ matrix.php }} / ${{ matrix.dependencies }} dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.5']
        dependencies: ['lowest', 'latest']
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, intl, mbstring, pdo_sqlite, imagick
          tools: composer:v2
          github-token: ${{ secrets.GITHUB_TOKEN }}
          coverage: none

      - name: Validate Composer manifest and lock
        run: composer validate --strict --no-check-publish --no-interaction

      - name: Install dependencies
        run: |
          if [ "${{ matrix.dependencies }}" = "lowest" ]; then
            composer update --prefer-lowest --prefer-stable --prefer-dist --no-interaction --no-progress --no-scripts
          else
            composer update --prefer-dist --no-interaction --no-progress --no-scripts
          fi

      - name: Audit dependencies
        run: composer audit --locked --no-interaction

      - name: Check PHP syntax
        run: composer lint

      - name: Run tests
        run: composer test --no-interaction
